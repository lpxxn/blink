openapi: 3.0.3
info:
  title: Blink HTTP API
  description: |
    本仓库 HTTP 接口的 OpenAPI 描述；与 `infrastructure/interface/http/` 及 `cmd/main.go` 中的路由一致。

    **`POST /auth/register`**：始终挂载（见 `cmd/main.go`），用于邮箱密码注册并建立 `builtin` 身份绑定。

    **内置 IdP**：`/auth/idp/*` 以及 OAuth 提供方 **`builtin`** 仅在配置了 `BLINK_PUBLIC_BASE_URL`、`BLINK_OAUTH_CLIENT_SECRET` 等环境变量时启用；未配置时上述路径返回 **404**，但不影响 `/auth/register`。

    **代码生成**：仅带标签 `servergen` 的操作会由 oapi-codegen 生成 Gin 注册代码与 `ServerInterface` 方法；其余路径为手写路由，此处仅作文档。

    **社交与管理**：`/api/*`、`/admin/api/*` 为手写路由（见 `cmd/main.go`），OpenAPI 中 `social` / `admin` / `feedback` / `notifications` 标签描述之。

    **管理权限**：`users.role` 为 `admin` 或 `super_admin` 时可访问 `/admin/api/*`（需有效会话）。部分能力（如 SMTP 配置）在实现上仍建议仅授予 `super_admin`。
  version: 0.1.0
servers:
  - url: http://127.0.0.1:11110
    description: 本地开发（默认 BLINK_HTTP_ADDR=:11110）
  - url: http://localhost:11110
    description: 本地开发（localhost）
  - url: "http://127.0.0.1:{port}"
    description: 本地其它端口（与当前 BLINK_HTTP_ADDR 一致，在 Swagger 里改 port）
    variables:
      port:
        default: "11110"
  - url: /
    description: 与 Swagger UI 同源（把文档托管在本 API 上时用此项）
tags:
  - name: system
    description: 运维与健康检查
  - name: oauth
    description: 第三方 / 内置 OAuth2 登录入口（`/auth/oauth`）
  - name: idp
    description: 内置 OAuth2 授权服务（Authorization Server）
  - name: auth
    description: 账号注册（默认即挂载，不依赖自建 IdP）
  - name: servergen
    description: 参与 oapi-codegen Gin 生成的操作（勿删此标签于已生成路径上）
  - name: social
    description: 帖子流、分类、评论、图片上传（手写路由，见 cmd/main.go）
  - name: feedback
    description: 意见反馈（用户侧与管理员侧）
  - name: notifications
    description: 站内通知（需登录）
  - name: admin
    description: 管理后台 JSON API（需会话且 users.role 为 admin 或 super_admin）

paths:
  /health:
    get:
      operationId: getHealth
      tags: [system, servergen]
      summary: 健康检查（JSON）
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /healthz:
    get:
      operationId: getHealthz
      tags: [system]
      summary: 健康检查（纯文本，探活）
      responses:
        "200":
          description: 正文为字面量 `ok`
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /auth/oauth/{provider}/login:
    get:
      operationId: oauthLoginRedirect
      tags: [oauth]
      summary: 发起 OAuth 登录
      description: 重定向至对应 `provider` 的授权页；成功时为 302。
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: next
          in: query
          required: false
          description: 登录成功后回跳路径（由应用内状态保存，完成回调后重定向）
          schema:
            type: string
      responses:
        "302":
          description: 重定向至 IdP 授权 URL
          headers:
            Location:
              schema:
                type: string
        "400":
          description: 未知 provider 或参数错误；正文为纯文本
          content:
            text/plain:
              schema:
                type: string

  /auth/oauth/{provider}/callback:
    get:
      operationId: oauthCallback
      tags: [oauth]
      summary: OAuth 回调
      description: |
        用授权码换会话，设置 HttpOnly Cookie `blink_session`，再 302 到 `next`。
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: 重定向到登录前保存的 `next`
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: HttpOnly `blink_session`
              schema:
                type: string
        "400":
          description: 缺少 code/state 或换票失败
          content:
            text/plain:
              schema:
                type: string

  /auth/idp/authorize:
    get:
      operationId: idpAuthorizeGet
      tags: [idp]
      summary: 授权页（HTML）
      description: OAuth2 授权端点；返回登录表单 HTML。
      parameters:
        - $ref: "#/components/parameters/OAuthClientId"
        - $ref: "#/components/parameters/OAuthRedirectURI"
        - $ref: "#/components/parameters/OAuthResponseType"
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 登录页 HTML
          content:
            text/html:
              schema:
                type: string
        "400":
          description: 参数不合法或缺少 state
          content:
            text/plain:
              schema:
                type: string
    post:
      operationId: idpAuthorizePost
      tags: [idp]
      summary: 提交登录表单
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - client_id
                - redirect_uri
                - state
                - response_type
                - email
                - password
              properties:
                client_id:
                  type: string
                redirect_uri:
                  type: string
                state:
                  type: string
                response_type:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "302":
          description: 登录成功，重定向回客户端 `redirect_uri`（带授权码）
          headers:
            Location:
              schema:
                type: string
        "400":
          description: 表单解析失败
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: 邮箱或密码错误
          content:
            text/plain:
              schema:
                type: string

  /auth/idp/token:
    post:
      operationId: idpToken
      tags: [idp]
      summary: OAuth2 Token 端点
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
                - code
                - redirect_uri
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  example: authorization_code
                code:
                  type: string
                redirect_uri:
                  type: string
                client_id:
                  type: string
                client_secret:
                  type: string
      responses:
        "200":
          description: 访问令牌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          description: 换票失败（如 `invalid_grant`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenError"
        "405":
          description: 非 POST

  /auth/idp/userinfo:
    get:
      operationId: idpUserInfo
      tags: [idp]
      summary: OpenID 风格 UserInfo
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          description: 缺少或无效的 Bearer Token
          content:
            text/plain:
              schema:
                type: string

  /auth/register/send_code:
    post:
      operationId: registerSendCode
      tags: [auth]
      summary: 发送注册邮箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: 已发送（或配置关闭验证时无操作）
        "400":
          description: 邮箱无效
        "429":
          description: 发送过于频繁

  /auth/register/config:
    get:
      operationId: registerConfig
      tags: [auth]
      summary: 注册是否需要邮箱验证码
      responses:
        "200":
          description: '`{ "email_verification_required": bool }`'

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: 用户注册
      description: |
        路由**始终挂载**。当后台开启「注册邮箱验证」时，body 须含 `code`（先调 `POST /auth/register/send_code`）。
        成功时 `201`；若配置了会话存储，会设置 Cookie `blink_session`，且 JSON 可含 `session_token`、`session_cookie`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          headers:
            Set-Cookie:
              description: 若启用会话则下发 HttpOnly `blink_session`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: 请求体非法、密码过短或邮箱格式无效
          content:
            text/plain:
              schema:
                type: string
        "405":
          description: 非 POST
        "409":
          description: 邮箱已注册
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: 服务器错误
          content:
            text/plain:
              schema:
                type: string

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: 邮箱 + 密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功，Set-Cookie `blink_session`
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    description: snowflake ID（字符串）
        "401":
          description: 凭据错误

  /auth/password/send_code:
    post:
      operationId: passwordResetSendCode
      tags: [auth]
      summary: 找回密码 — 发送邮箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          description: 已发送（邮箱不存在时也返回 204，防枚举）

  /auth/password/reset:
    post:
      operationId: passwordReset
      tags: [auth]
      summary: 找回密码 — 验证码 + 新密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, password]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        "204":
          description: 密码已更新
        "400":
          description: 验证码无效或密码过短

  /api/categories:
    get:
      operationId: listCategories
      tags: [social]
      summary: 分类列表
      responses:
        "200":
          description: 'JSON `{ "categories": [...] }`'

  /api/posts:
    get:
      operationId: listPosts
      tags: [social]
      summary: 公开帖子流
      description: |
        Query `category_id`、`uncategorized=1`、`cursor`（上一页最后一条 id）、`limit`。
        可选会话（Cookie / Bearer）：登录后响应中每条帖子含 `liked`；`like_count` 始终返回。
      responses:
        "200":
          description: '`{ "posts": [...], "next_cursor": int64|null }`'
    post:
      operationId: createPost
      tags: [social]
      summary: 发帖（需登录）
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                category_id:
                  type: integer
                  format: int64
                  nullable: true
                images:
                  type: array
                  items:
                    type: string
                draft:
                  type: boolean
      responses:
        "201":
          description: 帖子 JSON

  /api/posts/{id}:
    get:
      operationId: getPost
      tags: [social]
      summary: 帖子详情（可选登录；作者可看草稿/非公开）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: 帖子 JSON
        "404":
          description: 不存在或对当前访客不可见
    patch:
      operationId: patchPost
      tags: [social]
      summary: 修改自己的帖子
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                category_id:
                  type: integer
                  format: int64
                clear_category:
                  type: boolean
                images:
                  type: array
                  items:
                    type: string
                status:
                  type: integer
      responses:
        "200":
          description: 更新后帖子
    delete:
      operationId: deletePost
      tags: [social]
      summary: 删除自己的帖子（软删）
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 成功

  /api/me/posts:
    get:
      operationId: listMyPosts
      tags: [social]
      summary: 我的帖子
      security:
        - sessionCookie: []
        - bearerAuth: []
      description: Query `include_draft=1`、`cursor`、`limit`。
      responses:
        "200":
          description: 同 listPosts

  /api/me/posts/following:
    get:
      operationId: listFollowingPosts
      tags: [social]
      summary: 关注流（需登录）
      security:
        - sessionCookie: []
        - bearerAuth: []
      description: |
        返回当前用户所关注用户发布的公开已发布原创帖，按 id 降序分页。
        Query：`cursor`（上一页最后一条帖子 id）、`limit`（默认 20，最大 50）。
      responses:
        "200":
          description: 同 listPosts
        "401":
          description: 未登录

  /api/search/posts:
    get:
      operationId: searchPosts
      tags: [social]
      summary: 搜索帖子（可选登录）
      description: |
        Query：`q`（必填，1–100 字符）、`cursor`、`limit`。
        仅匹配已发布、公开、审核正常的原创帖正文；登录时含 `liked`。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: 同 listPosts
        "400":
          description: 缺少或无效 q

  /api/search/users:
    get:
      operationId: searchUsers
      tags: [social]
      summary: 搜索用户（按展示名）
      description: |
        Query：`q`（必填）、`offset`（默认 0）、`limit`（默认 20，最大 50）。
        仅返回 status=正常 的用户；响应不含邮箱。
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: '`{ "users": [...], "next_offset": int|null }`'
        "400":
          description: 缺少或无效 q

  /api/me/following:
    get:
      operationId: listMyFollowing
      tags: [social]
      summary: 我关注的用户列表
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FollowListCursor"
        - $ref: "#/components/parameters/FollowListLimit"
      responses:
        "200":
          description: 关注列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUsersPage"
        "401":
          description: 未登录

  /api/me/followers:
    get:
      operationId: listMyFollowers
      tags: [social]
      summary: 关注我的用户列表（粉丝）
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FollowListCursor"
        - $ref: "#/components/parameters/FollowListLimit"
      responses:
        "200":
          description: 粉丝列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUsersPage"
        "401":
          description: 未登录

  /api/posts/{id}/replies:
    get:
      operationId: listReplies
      tags: [social]
      summary: 评论列表（仅已发布且公开的根帖）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: '`{ "replies": [...], "next_cursor" }`'
    post:
      operationId: createReply
      tags: [social]
      summary: 发表评论
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                parent_reply_id:
                  type: integer
                  format: int64
                  nullable: true
      responses:
        "201":
          description: 评论 JSON

  /api/posts/like_rankings:
    get:
      operationId: listLikeRankings
      tags: [social]
      summary: 帖子点赞排行榜（今日 / 近 7 天 / 本月）
      description: |
        按时间窗口内收到的点赞数（`post_likes.created_at`）对**已发布且公开可见**的帖子排名。
        - `day`：今日 0:00（UTC）至今
        - `week`：近 7 天（滚动窗口）
        - `month`：本月 1 日 0:00（UTC）至今
        可选登录 Cookie 时返回 `liked`。
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: week
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        "200":
          description: '`{ "period", "posts": [{ "rank", "period_like_count", …PostJSON }] }`'
        "400":
          description: period 无效

  /api/posts/{id}/likes:
    get:
      operationId: getPostLikes
      tags: [social]
      summary: 帖子点赞数（可选登录返回是否已赞）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: '`{ "post_id", "like_count", "liked"? }`（snowflake 为字符串）'
        "404":
          description: 帖子不存在或不可见

  /api/posts/{id}/like:
    post:
      operationId: likePost
      tags: [social]
      summary: 点赞帖子
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 成功
        "409":
          description: 已点赞
    delete:
      operationId: unlikePost
      tags: [social]
      summary: 取消点赞
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: 成功
        "404":
          description: 未点赞

  /api/users/{id}/follow-stats:
    get:
      operationId: getUserFollowStats
      tags: [social]
      summary: 用户关注统计（可选登录返回是否已关注）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: '`{ "user_id", "follower_count", "following_count", "is_following"? }`'
        "404":
          description: 用户不存在

  /api/users/{id}/following:
    get:
      operationId: listUserFollowing
      tags: [social]
      summary: 某用户关注的列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/FollowListCursor"
        - $ref: "#/components/parameters/FollowListLimit"
      responses:
        "200":
          description: 关注列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUsersPage"
        "404":
          description: 用户不存在

  /api/users/{id}/followers:
    get:
      operationId: listUserFollowers
      tags: [social]
      summary: 某用户的粉丝列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - $ref: "#/components/parameters/FollowListCursor"
        - $ref: "#/components/parameters/FollowListLimit"
      responses:
        "200":
          description: 粉丝列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowUsersPage"
        "404":
          description: 用户不存在

  /api/users/{id}/follow:
    post:
      operationId: followUser
      tags: [social]
