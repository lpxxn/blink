components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: access_token
    sessionCookie:
      type: apiKey
      in: cookie
      name: blink_session

  parameters:
    OAuthProvider:
      name: provider
      in: path
      required: true
      description: 提供方标识，如 `google`、`builtin`、测试用 `test` 等
      schema:
        type: string
    OAuthClientId:
      name: client_id
      in: query
      required: true
      schema:
        type: string
    OAuthRedirectURI:
      name: redirect_uri
      in: query
      required: true
      schema:
        type: string
    OAuthResponseType:
      name: response_type
      in: query
      required: true
      schema:
        type: string
        example: code
    FollowListCursor:
      name: cursor
      in: query
      description: 分页游标，上一页最后一条的 `{unix_nano},{user_id}`
      schema:
        type: string
    FollowListLimit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100

  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    FollowUser:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
        user_name:
          type: string
        is_following:
          type: boolean
          description: 当前登录用户是否已关注该用户（登录且非本人时返回）

    FollowUsersPage:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/FollowUser"
        next_cursor:
          type: string
          description: 仅当本页满 limit 条时返回；值为 `{unix_nano},{user_id}`

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        code:
          type: string
          description: 开启注册邮箱验证时必填

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RegisterResponse:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
        session_token:
          type: string
          description: 若启用会话注册则返回；同时通过 Set-Cookie 下发
        session_cookie:
          type: string
          description: 固定为 `blink_session`，与 Cookie 名一致

    OAuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: 过期时间（秒）

    OAuthTokenError:
      type: object
      properties:
        error:
          type: string
          example: invalid_grant

    UserInfoResponse:
      type: object
      required: [sub, email, name]
      properties:
        sub:
          type: string
        email:
          type: string
        name:
          type: string
