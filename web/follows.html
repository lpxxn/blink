<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>关注与粉丝 — Blink</title>
  <link rel="stylesheet" href="/web/common.css" />
</head>
<body class="blink-page">
  <div class="shell shell-wide">
    <blink-nav active="mine"></blink-nav>

    <h1 class="page-title" id="page-title">关注与粉丝</h1>
    <p class="page-lead" id="page-lead">查看你关注的人，以及关注你的人。</p>
    <p id="err" class="err" role="alert"></p>

    <div class="card" style="padding:0.75rem 1rem 1rem">
      <div class="follow-tabs btn-row" role="tablist" style="margin-bottom:0.75rem">
        <button type="button" class="btn btn-secondary btn-sm" id="tab-following" role="tab" data-tab="following">我关注的</button>
        <button type="button" class="btn btn-secondary btn-sm" id="tab-followers" role="tab" data-tab="followers">关注我的</button>
      </div>
      <div id="list"></div>
      <p style="margin-top:0.75rem;margin-bottom:0">
        <button type="button" class="btn btn-secondary" id="more" hidden>加载更多</button>
      </p>
    </div>
  </div>
  <script src="/web/assets/js/api.js"></script>
  <script src="/web/assets/js/social.js"></script>
  <script src="/web/assets/js/ui.js"></script>
  <script src="/web/assets/js/nav.js"></script>
  <script src="/web/assets/js/pages/follows.js"></script>

</html>
